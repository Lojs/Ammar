# استخدم هذا الملف لتشغيل عَمار بسحب الصورة الجاهزة من GitHub مباشرة،
# بدون تحميل كود المشروع على جهازك إطلاقًا.

services:
  ammar:
    image: ghcr.io/Lojs/Ammar:latest
    container_name: ammar
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      PORT: 8080
      DATA_DIR: /data
      TZ: Asia/Kuwait
    volumes:
      - ./data:/data
